[workspace]
members = ["crates/eko-core", "crates/eko-tauri", "crates/eko-net", "crates/eko-cli"]
resolver = "2"

[workspace.package]
version = "0.4.37"
edition = "2021"
authors = ["Reactive Pixels"]

# Shared dependencies used by more than one workspace member — pinned once here so
# every crate stays on the same version. Member crates opt in with `dep.workspace = true`.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.15"
symphonia = { version = "0.5", features = ["all"] }
rustfft = "6"
triple_buffer = "9.0.0"
lofty = "0.22"
